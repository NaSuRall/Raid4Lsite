<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Album Voyage</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" id="brand">Album Voyage</a>
  <nav><a href="/album.html">Voir l'album</a></nav>
</header>

<main>
  <div class="shell">
    <div class="steps-wrap">
      <div class="steps-flow-label"><span class="tag tag-neutral">Pour les voyageurs</span></div>
      <div class="steps">
        <div class="step is-now"><div class="badge">1</div><div class="label">Vos infos</div></div>
        <div class="step"><div class="badge">2</div><div class="label">Vos photos</div></div>
        <div class="step"><div class="badge">3</div><div class="label">Terminé</div></div>
      </div>
    </div>

    <div class="page-card">
      <div class="hero-block"></div>
      <p style="text-align:center;">Ajoutez vos photos à l'album du voyage <strong id="trip-name-inline">Notre Voyage</strong>.</p>

      <form id="register-form">
        <div class="field">
          <label for="name">Votre prénom</label>
          <input class="input" type="text" id="name" name="name" placeholder="Votre prénom" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Votre adresse email</label>
          <input class="input" type="email" id="email" name="email" placeholder="vous@example.com" required autocomplete="email" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          Continuer
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </button>
        <div id="msg"></div>
      </form>

      <p class="text-muted" style="text-align:center;margin-top:20px;font-size:14px;">Déjà inscrit(e) ? <a href="/upload.html" id="continue-link">Continuer vers l'upload</a></p>
    </div>
  </div>
</main>

<footer>Album Voyage</footer>

<script src="/js/config.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
